name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and ShellCheck
        run: bash tests/lint.sh
      - name: Bootstrap block is in sync
        run: bash tools/sync-bootstrap.sh --check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip openssl qrencode zbar-tools iproute2
      - name: Sandbox suites
        run: |
          for suite in harness block-ping validation release render transaction install clients export-doctor update uninstall coexistence docs packaging auto-update; do
            bash tests/run.sh --suite "$suite"
          done
      - name: Real REALITY traffic (network namespace)
        run: sudo env "PATH=$PATH" bash tests/run.sh --suite e2e

  # Debian is a primary target. Sandbox suites run as root inside the official images; this
  # job is advisory until it has proven stable (the privileged e2e suite stays on the VMs).
  debian:
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends             git ca-certificates jq curl unzip openssl qrencode zbar-tools iproute2 python3 util-linux procps
      - uses: actions/checkout@v4
      - name: Sandbox suites
        run: |
          for suite in harness block-ping validation release render transaction install clients export-doctor update uninstall coexistence docs packaging auto-update; do
            bash tests/run.sh --suite "$suite"
          done
